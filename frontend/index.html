<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css">
    <title>Music Recommender</title>
</head>

<body>
    <h1>Music Recommender 🎶</h1>

    <p>Discover songs similar to your favourites!</p>

    <input
        type="text"
        id="songInput"
        placeholder="Enter a song name"
    >

    <button id="recommendButton">
        Get Recommendations
    </button>

    

   <h2>Recommended Songs</h2>
    <div id="results"></div>

    <section class="playlist-section">
    <h2>Save Your Playlist</h2>

    <input
        type="text"
        id="playlistName"
        placeholder="Enter playlist name"
    >

    <button id="savePlaylistButton">
        Save Playlist
    </button>
    <div id="spotifyResult"></div>
    </section>

<script src="/static/jscript.js"></script>
</body>
</html>
